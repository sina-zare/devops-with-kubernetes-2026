
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-output-generator
          image: log_output_generator:1.0
          volumeMounts:
          - name: shared-log-output
            mountPath: /shared
          imagePullPolicy: Never

        - name: log-output-server
          image: log_output_server:1.0
          volumeMounts:
          - name: shared-log-output
            mountPath: /shared
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          
          volumeMounts:
            - name: shared-storage
              mountPath: /data

      volumes:
        - name: shared-log-output
          emptyDir: {}

        - name: shared-storage
          persistentVolumeClaim:
            claimName: shared-pvc